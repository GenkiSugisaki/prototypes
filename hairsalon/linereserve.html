<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nogami Salon — LINE予約デモ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Shippori+Mincho:wght@500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  font-family: 'Helvetica Neue', Helvetica, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, Arial, sans-serif;
  background: #111;
  color: #111;
}
#root { height: 100%; }
h1, h2, h3, p { text-wrap: pretty; }
.serif { font-family: 'Cormorant Garamond', serif; }
.jserif { font-family: 'Shippori Mincho', serif; }

/* ---------- app shell (full viewport, phone-first) ---------- */
.screen {
  width: 100%; height: 100dvh; max-width: 520px; margin: 0 auto;
  overflow: hidden; position: relative; background: #fff;
  display: flex; flex-direction: column;
}

/* ---------- chat ---------- */
.chat-header {
  background: #111; color: #fff;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) 18px 12px;
  display: flex; align-items: center; gap: 12px; z-index: 5;
}
.chat-header .back { font-size: 18px; color: #BBB; width: 20px; }
.chat-header .acct { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.acct-avatar { width: 34px; height: 34px; border-radius: 50%; background: #fff; color: #111; display: flex; align-items: center; justify-content: center; font-family: 'Cormorant Garamond', serif; font-size: 17px; font-weight: 600; flex-shrink: 0; }
.acct-name { font-size: 14px; font-weight: 600; letter-spacing: .06em; display: flex; align-items: center; gap: 6px; }
.acct-badge { background: #3A3A40; color: #C9C9D2; font-size: 9px; padding: 2px 6px; border-radius: 3px; letter-spacing: .1em; font-weight: 400; }
.chat-body { flex: 1; overflow-y: auto; background: #EDEBE6; padding: 14px 14px 18px; display: flex; flex-direction: column; gap: 10px; }
.day-divider { align-self: center; background: rgba(17,17,17,.08); color: #6B675E; font-size: 10px; letter-spacing: .14em; padding: 4px 14px; border-radius: 99px; margin: 4px 0; }
.msg-row { display: flex; gap: 8px; align-items: flex-end; max-width: 86%; }
.msg-row.bot { align-self: flex-start; }
.msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
.msg-avatar { width: 26px; height: 26px; border-radius: 50%; background: #111; color: #fff; display: flex; align-items: center; justify-content: center; font-family: 'Cormorant Garamond', serif; font-size: 13px; flex-shrink: 0; }
.bubble { padding: 10px 14px; font-size: 13px; line-height: 1.75; border-radius: 16px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.05); white-space: pre-line; }
.msg-row.bot .bubble { border-top-left-radius: 4px; }
.msg-row.user .bubble { background: #111; color: #fff; border-top-right-radius: 4px; }
.msg-time { font-size: 9px; color: #9B978D; flex-shrink: 0; margin-bottom: 2px; }
@media (prefers-reduced-motion: no-preference) {
  .msg-enter { animation: msgIn .26s ease; }
}
@keyframes msgIn { from { transform: translateY(8px); } to { transform: none; } }

/* confirmation card bubble */
.confirm-card { background: #fff; border-radius: 14px; border-top-left-radius: 4px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.07); width: 248px; }
.confirm-card .cc-head { background: #111; color: #fff; text-align: center; padding: 16px 14px 14px; }
.confirm-card .cc-head .en { font-family: 'Cormorant Garamond', serif; font-size: 17px; letter-spacing: .3em; text-indent: .3em; }
.confirm-card .cc-head .rule { width: 28px; height: 1px; background: rgba(255,255,255,.5); margin: 8px auto; }
.confirm-card .cc-head .ja { font-size: 10px; letter-spacing: .26em; color: #CCC; }
.confirm-card .cc-body { padding: 6px 16px 14px; }
.confirm-card .cc-row { display: flex; justify-content: space-between; align-items: baseline; padding: 9px 0; border-bottom: 1px solid #EDEDED; font-size: 12px; }
.confirm-card .cc-row:last-child { border-bottom: 0; }
.confirm-card .cc-row .k { color: #999; font-size: 10px; letter-spacing: .18em; }
.confirm-card .cc-row .v { font-weight: 600; letter-spacing: .04em; text-align: right; }

/* typing dots */
.typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
.typing i { width: 5px; height: 5px; border-radius: 50%; background: #B9B5AB; animation: blink 1.1s infinite; }
.typing i:nth-child(2) { animation-delay: .18s; } .typing i:nth-child(3) { animation-delay: .36s; }
@keyframes blink { 0%, 60%, 100% { opacity: .3; } 30% { opacity: 1; } }

/* ---------- rich menu ---------- */
.rich-menu { background: #111; color: #fff; flex-shrink: 0; }
.rich-menu .rm-main {
  display: block; width: 100%; background: none; border: 0; color: #fff; cursor: pointer;
  padding: 20px 16px 16px; text-align: center; font-family: inherit;
}
.rm-main .en { font-family: 'Cormorant Garamond', serif; font-size: 21px; letter-spacing: .34em; text-indent: .34em; display: block; }
.rm-main .rule { width: 36px; height: 1px; background: rgba(255,255,255,.55); margin: 9px auto; }
.rm-main .ja { font-size: 10px; letter-spacing: .3em; color: #CFCFCF; display: block; }
.rm-main:active { background: #1C1C1E; }
.rich-menu .rm-sub { display: grid; grid-template-columns: 1fr 1fr 1fr; border-top: 1px solid #2A2A2C; }
.rm-sub button { background: none; border: 0; color: #9A9AA2; font-size: 10px; letter-spacing: .2em; padding: 12px 4px calc(env(safe-area-inset-bottom, 0px) + 14px); cursor: pointer; font-family: inherit; }
.rm-sub button + button { border-left: 1px solid #2A2A2C; }
.rm-sub button:active { color: #fff; }

/* ---------- LIFF sheet ---------- */
.sheet-dim { position: absolute; inset: 0; background: rgba(0,0,0,.45); z-index: 40; opacity: 0; transition: opacity .3s; pointer-events: none; }
.sheet-dim.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; top: calc(env(safe-area-inset-top, 0px) + 52px); z-index: 50;
  background: #FFFFFF; border-radius: 22px 22px 0 0;
  transform: translateY(105%); transition: transform .38s cubic-bezier(.32,.72,.24,1);
  display: flex; flex-direction: column; overflow: hidden;
}
.sheet.open { transform: translateY(0); }
.liff-bar { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 10px; flex-shrink: 0; }
.liff-bar .ttl { font-family: 'Cormorant Garamond', serif; font-size: 15px; letter-spacing: .3em; text-indent: .3em; flex: 1; text-align: center; }
.liff-bar .x { background: none; border: 0; font-size: 17px; color: #999; cursor: pointer; width: 28px; padding: 0; font-family: inherit; }
.liff-bar .ghost { width: 28px; }

.steps { display: flex; justify-content: center; gap: 0; padding: 2px 0 14px; flex-shrink: 0; }
.step-dot { display: flex; align-items: center; }
.step-dot .lbl { font-size: 9px; letter-spacing: .22em; color: #BBB; padding: 0 2px; }
.step-dot.on .lbl { color: #111; }
.step-dot .ln { width: 26px; height: 1px; background: #DDD; margin: 0 6px; }

.sheet-body { flex: 1; overflow-y: auto; padding: 6px 26px 30px; }
.sheet-foot { flex-shrink: 0; padding: 14px 26px calc(env(safe-area-inset-bottom, 0px) + 22px); border-top: 1px solid #EFEFEF; background: #fff; }

.s-eyebrow { font-size: 10px; letter-spacing: .3em; color: #999; text-align: center; margin: 14px 0 6px; }
.s-title { font-family: 'Shippori Mincho', serif; font-size: 21px; font-weight: 600; text-align: center; letter-spacing: .12em; margin: 0 0 8px; }
.s-lead { font-size: 11.5px; color: #777; line-height: 1.9; text-align: center; margin: 0 0 22px; }

.field { margin-bottom: 18px; }
.field label { display: block; font-size: 10px; letter-spacing: .24em; color: #888; margin-bottom: 8px; }
.field input { width: 100%; border: 0; border-bottom: 1px solid #D8D8D8; padding: 8px 2px 10px; font-size: 16px; letter-spacing: .06em; outline: none; background: none; border-radius: 0; font-family: inherit; }
.field input:focus { border-bottom-color: #111; }
.field .err { font-size: 10.5px; color: #B4231B; margin-top: 6px; letter-spacing: .06em; }

.agree { display: flex; gap: 10px; align-items: flex-start; margin: 22px 0 6px; cursor: pointer; }
.agree input { margin: 2px 0 0; accent-color: #111; width: 15px; height: 15px; flex-shrink: 0; }
.agree .tx { font-size: 11.5px; color: #555; line-height: 1.8; }
.agree .tx u { text-underline-offset: 3px; cursor: pointer; }

.btn-primary {
  display: block; width: 100%; background: #111; color: #fff; border: 0; cursor: pointer;
  padding: 16px; font-size: 12px; letter-spacing: .3em; text-indent: .3em; font-family: inherit;
}
.btn-primary:disabled { background: #D5D5D5; cursor: default; }
.btn-primary:not(:disabled):active { background: #333; }
.btn-text { display: block; margin: 16px auto 0; background: none; border: 0; font-size: 10.5px; letter-spacing: .22em; color: #888; text-decoration: underline; text-underline-offset: 4px; cursor: pointer; font-family: inherit; }

/* code input */
.code-row { display: flex; gap: 10px; justify-content: center; margin: 10px 0 4px; }
.code-cell { width: 46px; height: 56px; border: 1px solid #D8D8D8; text-align: center; font-size: 24px; font-family: 'Cormorant Garamond', serif; display: flex; align-items: center; justify-content: center; }
.code-cell.filled { border-color: #111; }
.code-hidden { position: absolute; opacity: 0; pointer-events: none; }
.demo-hint { text-align: center; font-size: 10.5px; color: #999; letter-spacing: .1em; margin-top: 14px; font-family: ui-monospace, Menlo, monospace; }

/* service list */
.svc-row { display: flex; align-items: center; gap: 14px; padding: 17px 2px; border-bottom: 1px solid #E8E8E8; cursor: pointer; background: none; width: 100%; border-left: 0; border-right: 0; border-top: 0; text-align: left; font-family: inherit; }
.svc-row .nm { font-family: 'Shippori Mincho', serif; font-size: 17px; font-weight: 500; letter-spacing: .08em; flex: 1; }
.svc-row .meta { text-align: right; }
.svc-row .pr { font-size: 12px; letter-spacing: .12em; color: #444; }
.svc-row .du { font-size: 10px; letter-spacing: .16em; color: #AAA; margin-top: 3px; }
.svc-row .mark { width: 18px; height: 18px; border: 1px solid #CCC; border-radius: 50%; flex-shrink: 0; position: relative; }
.svc-row.sel .mark { border-color: #111; }
.svc-row.sel .mark::after { content: ''; position: absolute; inset: 4px; border-radius: 50%; background: #111; }
.svc-row:active { background: #FAFAFA; }

/* calendar */
.cal-head { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 12px; }
.cal-head .mo { font-family: 'Cormorant Garamond', serif; font-size: 18px; letter-spacing: .24em; }
.cal-head button { background: none; border: 1px solid #DDD; width: 30px; height: 30px; cursor: pointer; color: #555; font-size: 13px; font-family: inherit; }
.cal-head button:disabled { opacity: .3; cursor: default; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-grid .wd { text-align: center; font-size: 9px; letter-spacing: .14em; color: #AAA; padding: 4px 0 8px; }
.cal-grid .wd.sun { color: #C77; }
.day-cell { aspect-ratio: 1; border: 0; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-family: inherit; border-radius: 50%; }
.day-cell .d { font-size: 14px; font-family: 'Cormorant Garamond', serif; font-weight: 500; }
.day-cell .st { font-size: 8px; color: #999; }
.day-cell:disabled { opacity: .25; cursor: default; }
.day-cell.sel { background: #111; color: #fff; }
.day-cell.sel .st { color: #BBB; }
.day-cell:not(:disabled):not(.sel):hover { background: #F0F0F0; }
.closed-note { font-size: 10px; color: #AAA; letter-spacing: .14em; text-align: right; margin-top: 8px; }

.time-block { margin-top: 26px; }
.time-block h4 { font-size: 10px; letter-spacing: .26em; color: #888; font-weight: 400; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: baseline; }
.time-block h4 .gc { font-size: 9px; letter-spacing: .08em; color: #B5B5B5; font-family: ui-monospace, Menlo, monospace; }
.slot-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.slot { border: 1px solid #DDD; background: #fff; padding: 11px 0; font-size: 12.5px; letter-spacing: .1em; cursor: pointer; font-family: inherit; color: #111; }
.slot:disabled { color: #C8C8C8; border-color: #EEE; text-decoration: line-through; cursor: default; background: #FCFCFC; }
.slot.sel { background: #111; color: #fff; border-color: #111; }
.no-slots { font-size: 12px; color: #999; text-align: center; padding: 24px 0; letter-spacing: .1em; }

/* confirm screen */
.cf-list { border-top: 1px solid #E6E6E6; margin-top: 6px; }
.cf-row { display: flex; justify-content: space-between; align-items: baseline; padding: 16px 2px; border-bottom: 1px solid #E6E6E6; }
.cf-row .k { font-size: 10px; letter-spacing: .26em; color: #999; }
.cf-row .v { font-family: 'Shippori Mincho', serif; font-size: 16px; font-weight: 500; letter-spacing: .06em; text-align: right; }
.cf-note { font-size: 10.5px; color: #999; line-height: 1.9; margin-top: 18px; letter-spacing: .04em; }

/* policy modal */
.policy-dim { position: absolute; inset: 0; background: rgba(0,0,0,.5); z-index: 70; display: flex; align-items: center; justify-content: center; padding: 30px 22px; }
.policy-box { background: #fff; max-height: 100%; display: flex; flex-direction: column; width: 100%; }
.policy-box .ph2 { font-family: 'Shippori Mincho', serif; font-size: 15px; letter-spacing: .2em; text-align: center; padding: 22px 20px 0; margin: 0; }
.policy-box .pb { overflow-y: auto; padding: 16px 24px; font-size: 11px; color: #666; line-height: 2; }
.policy-box .pb h5 { font-size: 10px; letter-spacing: .2em; color: #111; margin: 14px 0 4px; }
.policy-box .pc { border-top: 1px solid #EEE; }
.policy-box .pc button { width: 100%; background: none; border: 0; padding: 15px; font-size: 11px; letter-spacing: .26em; cursor: pointer; font-family: inherit; }

/* spinner */
.spin { width: 26px; height: 26px; border: 2px solid #E2E2E2; border-top-color: #111; border-radius: 50%; margin: 30px auto; animation: rot .7s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }
.center-pad { text-align: center; padding: 40px 0; }
</style>
</head>
<body data-screen-label="LINE予約デモ">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ---------------- data ---------------- */
const SERVICES = [
  { id: 'cut',   name: 'カット',            price: '¥6,600',  dur: '約60分' },
  { id: 'color', name: 'カラー',            price: '¥8,800',  dur: '約90分' },
  { id: 'cc',    name: 'カット ＋ カラー',  price: '¥13,200', dur: '約150分' },
  { id: 'perm',  name: 'パーマ',            price: '¥9,900',  dur: '約120分' },
  { id: 'tr',    name: 'トリートメント',    price: '¥4,400',  dur: '約45分' },
];
// プロトタイプ用の固定データ：入力・選択内容にかかわらず、確認画面と予約確定はこの内容で表示する
const DEMO_USER = { name: '野上', phone: '090-1234-5678' };
const DEMO_BOOKING = { name: '野上', service: 'カット', date: '6月20日（土）', time: '10:00', price: '¥6,600' };

const WDAYS = ['日', '月', '火', '水', '木', '金', '土'];
const SLOT_TIMES = ['10:00','10:30','11:00','11:30','12:00','13:00','13:30','14:00','14:30','15:00','15:30','16:00','16:30','17:00','17:30','18:00'];

// deterministic pseudo-availability (would be Google Calendar freebusy in production)
function hashStr(s) { let h = 0; for (let i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) | 0; } return Math.abs(h); }
function isSlotFree(dateKey, time) { return hashStr(dateKey + time) % 10 < 6; }
function dateKey(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function fmtDateJa(d) { return (d.getMonth()+1) + '月' + d.getDate() + '日（' + WDAYS[d.getDay()] + '）'; }
function nowTime() { const n = new Date(); return String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0'); }

const LS_KEY = 'nogami_line_demo_user';

/* ---------------- chat pieces ---------------- */
function Bubble({ m }) {
  if (m.type === 'divider') return <div className="day-divider">{m.text}</div>;
  if (m.type === 'typing') return (
    <div className="msg-row bot msg-enter">
      <div className="msg-avatar">N</div>
      <div className="bubble"><span className="typing"><i></i><i></i><i></i></span></div>
    </div>
  );
  if (m.type === 'card') return (
    <div className="msg-row bot msg-enter">
      <div className="msg-avatar">N</div>
      <div className="confirm-card">
        <div className="cc-head">
          <div className="en">RESERVED</div>
          <div className="rule"></div>
          <div className="ja">ご予約確定</div>
        </div>
        <div className="cc-body">
          <div className="cc-row"><span className="k">お名前</span><span className="v">{m.data.name} 様</span></div>
          <div className="cc-row"><span className="k">メニュー</span><span className="v">{m.data.service}</span></div>
          <div className="cc-row"><span className="k">日時</span><span className="v">{m.data.date}　{m.data.time}</span></div>
          <div className="cc-row"><span className="k">料金</span><span className="v">{m.data.price}</span></div>
        </div>
      </div>
      <div className="msg-time">{m.time}</div>
    </div>
  );
  const isBot = m.from === 'bot';
  return (
    <div className={'msg-row msg-enter ' + (isBot ? 'bot' : 'user')}>
      {isBot && <div className="msg-avatar">N</div>}
      <div className="bubble">{m.text}</div>
      <div className="msg-time">{m.time}</div>
    </div>
  );
}

/* ---------------- verification ---------------- */
function VerifyForm({ onSent, openPolicy }) {
  const [phone, setPhone] = useState(DEMO_USER.phone);
  const [name, setName] = useState(DEMO_USER.name);
  const [agree, setAgree] = useState(true);
  return (
    <div>
      <p className="s-eyebrow">VERIFICATION</p>
      <h3 className="s-title">ご本人確認</h3>
      <p className="s-lead">初めてご利用のお客様には、<br />SMS認証をお願いしております。</p>
      <div className="field">
        <label>お電話番号</label>
        <input type="tel" inputMode="numeric" value={phone} onChange={e => setPhone(e.target.value)} />
      </div>
      <div className="field">
        <label>お名前（ニックネーム可）</label>
        <input type="text" value={name} onChange={e => setName(e.target.value)} />
      </div>
      <label className="agree">
        <input type="checkbox" checked={agree} onChange={e => setAgree(e.target.checked)} />
        <span className="tx"><u onClick={e => { e.preventDefault(); openPolicy(); }}>プライバシーポリシー</u>に同意します。お電話番号は、ご予約に関するご連絡のみに使用いたします。</span>
      </label>
      <div className="demo-hint">※ デモのため入力済みです。そのままお進みください</div>
      <div style={{ height: 18 }}></div>
      <button className="btn-primary" onClick={() => onSent()}>認証コードを送信</button>
    </div>
  );
}

function VerifyCode({ onVerified, onBack }) {
  const masked = '090-＊＊＊＊-' + DEMO_USER.phone.slice(-4);
  return (
    <div>
      <p className="s-eyebrow">SMS CODE</p>
      <h3 className="s-title">認証コード入力</h3>
      <p className="s-lead">{masked} 宛てにお送りした<br />4桁の認証コードをご入力ください。</p>
      <div className="code-row">
        {['0','0','0','0'].map((c, i) => (
          <div key={i} className="code-cell filled">{c}</div>
        ))}
      </div>
      <div className="demo-hint">※ デモのため自動入力されています</div>
      <div style={{ height: 18 }}></div>
      <button className="btn-primary" onClick={onVerified}>認証して次へ</button>
      <button className="btn-text" onClick={onBack}>入力内容を修正する</button>
    </div>
  );
}

/* ---------------- service ---------------- */
function ServicePick({ sel, onSel }) {
  return (
    <div>
      <p className="s-eyebrow">MENU</p>
      <h3 className="s-title">メニューを選択</h3>
      <p className="s-lead">ご希望の施術をお選びください。</p>
      <div>
        {SERVICES.map(s => (
          <button key={s.id} className={'svc-row' + (sel === s.id ? ' sel' : '')} onClick={() => onSel(s.id)}>
            <span className="mark"></span>
            <span className="nm">{s.name}</span>
            <span className="meta"><div className="pr">{s.price}</div><div className="du">{s.dur}</div></span>
          </button>
        ))}
      </div>
    </div>
  );
}

/* ---------------- date & time (combined) ---------------- */
function buildDays(offsetWeeks) {
  const today = new Date(); today.setHours(0,0,0,0);
  const start = new Date(today); start.setDate(start.getDate() - start.getDay() + offsetWeeks * 7);
  const days = [];
  for (let i = 0; i < 14; i++) { const d = new Date(start); d.setDate(start.getDate() + i); days.push(d); }
  return days;
}
function dayHasSlots(d) { const k = dateKey(d); return SLOT_TIMES.some(t => isSlotFree(k, t)); }

function DateTimePick({ pick, setPick }) {
  const [week, setWeek] = useState(0);
  const today = new Date(); today.setHours(0,0,0,0);
  const days = buildDays(week);
  const monthLabel = (days[0].getMonth()+1) + '月' + (days[0].getMonth() !== days[13].getMonth() ? ' / ' + (days[13].getMonth()+1) + '月' : '');
  const selKey = pick.date ? dateKey(pick.date) : null;
  const slots = pick.date ? SLOT_TIMES.map(t => ({ t, free: isSlotFree(selKey, t) })) : [];
  const anyFree = slots.some(s => s.free);
  return (
    <div>
      <p className="s-eyebrow">DATE &amp; TIME</p>
      <h3 className="s-title">日時を選択</h3>
      <p className="s-lead">日付をお選びいただくと、<br />その日の空き時間が表示されます。</p>
      <div className="cal-head">
        <button disabled={week === 0} onClick={() => setWeek(w => Math.max(0, w - 1))}>‹</button>
        <span className="mo">{monthLabel}</span>
        <button disabled={week >= 3} onClick={() => setWeek(w => Math.min(3, w + 1))}>›</button>
      </div>
      <div className="cal-grid">
        {WDAYS.map((w, i) => <div key={w} className={'wd' + (i === 0 ? ' sun' : '')}>{w}</div>)}
        {days.map(d => {
          const k = dateKey(d);
          const past = d < today;
          const closed = d.getDay() === 1; // 月曜定休
          const disabled = past || closed || !dayHasSlots(d);
          const isSel = selKey === k;
          return (
            <button key={k} className={'day-cell' + (isSel ? ' sel' : '')} disabled={disabled}
              onClick={() => setPick(p => ({ ...p, date: d, time: null }))}>
              <span className="d">{d.getDate()}</span>
              <span className="st">{closed ? '休' : (past ? '' : (dayHasSlots(d) ? '○' : '×'))}</span>
            </button>
          );
        })}
      </div>
      <div className="closed-note">毎週月曜定休</div>
      {pick.date && (
        <div className="time-block">
          <h4>
            <span>{fmtDateJa(pick.date)} の空き時間</span>
            <span className="gc">⟳ Google Calendar</span>
          </h4>
          {anyFree ? (
            <div className="slot-grid">
              {slots.map(s => (
                <button key={s.t} className={'slot' + (pick.time === s.t ? ' sel' : '')} disabled={!s.free}
                  onClick={() => setPick(p => ({ ...p, time: s.t }))}>{s.t}</button>
              ))}
            </div>
          ) : <div className="no-slots">この日はご予約が埋まっております。別の日をお選びください。</div>}
        </div>
      )}
    </div>
  );
}

/* ---------------- confirm ---------------- */
function ConfirmView() {
  return (
    <div>
      <p className="s-eyebrow">CONFIRM</p>
      <h3 className="s-title">ご予約内容の確認</h3>
      <p className="s-lead">内容をご確認のうえ、ご予約を確定してください。</p>
      <div className="cf-list">
        <div className="cf-row"><span className="k">お名前</span><span className="v">{DEMO_BOOKING.name} 様</span></div>
        <div className="cf-row"><span className="k">メニュー</span><span className="v">{DEMO_BOOKING.service}</span></div>
        <div className="cf-row"><span className="k">日時</span><span className="v">{DEMO_BOOKING.date}　{DEMO_BOOKING.time}</span></div>
        <div className="cf-row"><span className="k">料金（目安）</span><span className="v">{DEMO_BOOKING.price}</span></div>
      </div>
      <p className="cf-note">※ デモのため、表示内容は固定です。<br />※ ご予約の変更・キャンセルは、前日までにこのトークからご連絡ください。<br />※ 確定すると、サロンのGoogleカレンダーに自動で登録されます。</p>
    </div>
  );
}

/* ---------------- privacy policy ---------------- */
function PolicyModal({ onClose }) {
  return (
    <div className="policy-dim" onClick={onClose}>
      <div className="policy-box" onClick={e => e.stopPropagation()}>
        <h4 className="ph2">プライバシーポリシー</h4>
        <div className="pb">
          <h5>1. 取得する情報</h5>
          当サロンは、ご予約の受付にあたり、お名前（ニックネーム可）およびお電話番号を取得いたします。
          <h5>2. 利用目的</h5>
          取得した情報は、ご予約の確認・変更・キャンセルのご連絡、および無断キャンセル防止のためにのみ利用いたします。
          <h5>3. 第三者提供</h5>
          法令に基づく場合を除き、お客様の同意なく第三者に提供することはありません。
          <h5>4. 保管期間</h5>
          最終のご来店から1年を経過した情報は、適切な方法で削除いたします。
          <h5>5. お問い合わせ</h5>
          本ポリシーに関するお問い合わせは、このトークまたは店頭にてお気軽にお申し付けください。
        </div>
        <div className="pc"><button onClick={onClose}>閉じる</button></div>
      </div>
    </div>
  );
}

/* ---------------- LIFF sheet ---------------- */
const STEP_LABELS = [['verify', '認証'], ['service', 'メニュー'], ['datetime', '日時'], ['confirm', '確認']];

function LiffSheet({ open, stage, user, serviceId, pick, setPick,
                     onClose, onCodeSent, onVerified, onBackToForm, onSelService,
                     onToDatetime, onToConfirm, onBackTo, onFinalize, openPolicy, busy }) {
  const stepIdx = { 'verify-form': 0, 'verify-code': 0, 'service': 1, 'datetime': 2, 'confirm': 3 }[stage] ?? 0;
  const showSteps = !(user && stepIdx === 0);

  let foot = null;
  if (stage === 'service') foot = <button className="btn-primary" onClick={onToDatetime}>日時の選択へ</button>;
  if (stage === 'datetime') foot = (
    <div>
      <button className="btn-primary" onClick={onToConfirm}>内容の確認へ</button>
      <button className="btn-text" onClick={() => onBackTo('service')}>メニューを選び直す</button>
    </div>
  );
  if (stage === 'confirm') foot = (
    <div>
      <button className="btn-primary" disabled={busy} onClick={onFinalize}>{busy ? '送信中…' : 'この内容で予約を確定する'}</button>
      <button className="btn-text" onClick={() => onBackTo('datetime')}>日時を選び直す</button>
    </div>
  );

  return (
    <div className={'sheet' + (open ? ' open' : '')}>
      <div className="liff-bar">
        <span className="ghost"></span>
        <span className="ttl">NOGAMI SALON</span>
        <button className="x" onClick={onClose} aria-label="閉じる">✕</button>
      </div>
      <div className="steps">
        {STEP_LABELS.map(([key, lbl], i) => (
          <span key={key} className={'step-dot' + (i <= stepIdx ? ' on' : '')}>
            <span className="lbl">{lbl}</span>
            {i < STEP_LABELS.length - 1 && <span className="ln"></span>}
          </span>
        ))}
      </div>
      <div className="sheet-body">
        {stage === 'verify-form' && <VerifyForm onSent={onCodeSent} openPolicy={openPolicy} />}
        {stage === 'verify-code' && <VerifyCode onVerified={onVerified} onBack={onBackToForm} />}
        {stage === 'checking' && <div className="center-pad"><div className="spin"></div><p className="s-lead">ご登録状況を確認しています…</p></div>}
        {stage === 'service' && <ServicePick sel={serviceId} onSel={onSelService} />}
        {stage === 'datetime' && <DateTimePick pick={pick} setPick={setPick} />}
        {stage === 'confirm' && <ConfirmView />}
      </div>
      {foot && open && <div className="sheet-foot">{foot}</div>}
    </div>
  );
}

/* ---------------- app ---------------- */
let msgId = 0;
function App() {
  const [user, setUser] = useState(() => {
    try { return JSON.parse(localStorage.getItem(LS_KEY)) || null; } catch (e) { return null; }
  });
  const [messages, setMessages] = useState(() => [
    { id: ++msgId, type: 'divider', text: '今日' },
    { id: ++msgId, from: 'bot', text: '友だち追加ありがとうございます。\nNogami Salon 公式アカウントです。\n\nご予約は、下の「ご予約はこちら」ボタンからどうぞ。', time: nowTime() },
  ]);
  const [sheetOpen, setSheetOpen] = useState(false);
  const [stage, setStage] = useState('verify-form');
  const [serviceId, setServiceId] = useState('cut');
  const [pick, setPick] = useState({ date: null, time: null });
  const [policyOpen, setPolicyOpen] = useState(false);
  const [busy, setBusy] = useState(false);
  const bodyRef = useRef(null);

  useEffect(() => {
    const el = bodyRef.current;
    if (el) el.scrollTop = el.scrollHeight;
  }, [messages, sheetOpen]);

  const addMsg = useCallback((m) => setMessages(ms => [...ms, { id: ++msgId, time: nowTime(), ...m }]), []);
  const botSay = useCallback((text, delay = 700, extra) => {
    const tid = ++msgId;
    setMessages(ms => [...ms, { id: tid, type: 'typing' }]);
    setTimeout(() => {
      setMessages(ms => ms.filter(m => m.id !== tid).concat([{ id: ++msgId, from: 'bot', time: nowTime(), text, ...extra }]));
    }, delay);
  }, []);

  /* step 1+2: tap reserve → check verification */
  const startReserve = () => {
    addMsg({ from: 'user', text: 'ご予約' });
    setServiceId('cut');
    setPick({ date: null, time: null });
    setStage('checking');
    setSheetOpen(true);
    setTimeout(() => {
      if (user) {
        botSay(user.name + ' 様、いつもご利用ありがとうございます。\nこのままご予約にお進みいただけます。', 500);
        setStage('service');
      } else {
        botSay('はじめてのご予約ですね。\n無断キャンセル防止のため、初回のみご本人確認をお願いしております。', 500);
        setStage('verify-form');
      }
    }, 900);
  };

  const handleCodeSent = () => { setStage('verify-code'); };
  const handleVerified = () => {
    setUser(DEMO_USER);
    try { localStorage.setItem(LS_KEY, JSON.stringify(DEMO_USER)); } catch (e) {}
    botSay(DEMO_USER.name + ' 様、認証が完了いたしました。\nそれでは、ご希望のメニューをお選びください。', 600);
    setStage('service');
  };

  /* step 5: finalize — プロトタイプのため予約内容は DEMO_BOOKING 固定 */
  const finalize = () => {
    setBusy(true);
    setTimeout(() => {
      setBusy(false);
      setSheetOpen(false);
      setTimeout(() => {
        addMsg({ type: 'card', data: DEMO_BOOKING });
        botSay(DEMO_BOOKING.name + ' 様、ご予約ありがとうございます。\n' + DEMO_BOOKING.date + ' ' + DEMO_BOOKING.time + 'より、' + DEMO_BOOKING.service + 'のご予約を承りました。\n\n前日にリマインドのメッセージをお送りいたします。ご来店を心よりお待ちしております。', 1100);
      }, 350);
    }, 1100);
  };

  const resetDemo = () => {
    try { localStorage.removeItem(LS_KEY); } catch (e) {}
    setUser(null); setSheetOpen(false); setServiceId('cut'); setPick({ date: null, time: null });
    setMessages([
      { id: ++msgId, type: 'divider', text: '今日' },
      { id: ++msgId, from: 'bot', text: '友だち追加ありがとうございます。\nNogami Salon 公式アカウントです。\n\nご予約は、下の「ご予約はこちら」ボタンからどうぞ。', time: nowTime() },
    ]);
  };

  /* hidden demo reset: tap the avatar in the header 5 times */
  const tapCount = useRef(0);
  const tapTimer = useRef(null);
  const avatarTap = () => {
    tapCount.current += 1;
    clearTimeout(tapTimer.current);
    tapTimer.current = setTimeout(() => { tapCount.current = 0; }, 1200);
    if (tapCount.current >= 5) {
      tapCount.current = 0;
      resetDemo();
      botSay('（デモをリセットしました。認証状態もクリアされています。）', 400);
    }
  };

  return (
    <div className="screen">
      <header className="chat-header">
        <span className="back">‹</span>
        <div className="acct">
          <div className="acct-avatar" onClick={avatarTap}>N</div>
          <div className="acct-name">Nogami Salon <span className="acct-badge">公式</span></div>
        </div>
      </header>
      <div className="chat-body" ref={bodyRef}>
        {messages.map(m => <Bubble key={m.id} m={m} />)}
      </div>
      <nav className="rich-menu">
        <button className="rm-main" onClick={startReserve}>
          <span className="en">RESERVATION</span>
          <span className="rule"></span>
          <span className="ja">ご予約はこちら</span>
        </button>
        <div className="rm-sub">
          <button onClick={() => botSay('営業時間：火〜土 10:00 − 19:00\n定休日：毎週月曜', 600)}>営業時間</button>
          <button onClick={() => botSay('カット ¥6,600 〜\nカラー ¥8,800 〜\nパーマ ¥9,900 〜\nトリートメント ¥4,400 〜\n\n各メニューの詳細は、ご予約の際にご確認いただけます。', 600)}>メニュー</button>
          <button onClick={() => botSay('東京都渋谷区◯◯ 1-2-3\n◯◯駅から徒歩5分\n\nお車でお越しの際は、近隣のコインパーキングをご利用ください。', 600)}>アクセス</button>
        </div>
      </nav>

      <div className={'sheet-dim' + (sheetOpen ? ' open' : '')} onClick={() => setSheetOpen(false)}></div>
      <LiffSheet
        open={sheetOpen} stage={stage} user={user}
        serviceId={serviceId} pick={pick} setPick={setPick}
        onClose={() => setSheetOpen(false)}
        onCodeSent={handleCodeSent}
        onVerified={handleVerified}
        onBackToForm={() => setStage('verify-form')}
        onSelService={setServiceId}
        onToDatetime={() => setStage('datetime')}
        onToConfirm={() => setStage('confirm')}
        onBackTo={setStage}
        onFinalize={finalize}
        openPolicy={() => setPolicyOpen(true)}
        busy={busy}
      />
      {policyOpen && <PolicyModal onClose={() => setPolicyOpen(false)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
