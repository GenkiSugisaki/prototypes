<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>FAQ — おくみや株式会社</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap"/>
<link rel="stylesheet" href="shared/base.css"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div data-nav-host></div>
<main>
  <section class="section">
    <div class="container">
      <span class="eyebrow" data-i="faq.eyebrow"></span>
      <h2 style="font-size:var(--h1);margin-top:14px">Q&amp;A</h2>
      <div class="A-faq" style="margin-top:36px" data-render="faq"></div>
    </div>
  </section>
</main>
<div data-foot-host></div>
<div data-tools-host></div>
<script src="shared/i18n.js"></script>
<script src="shared/app.js"></script>
<script>
(function(){
  function render(){
    const lang = Okumiya.LS.get('lang','ja');
    const t = window.OKUMIYA_I18N[lang];
    document.querySelectorAll('[data-i]').forEach(el=>{
      const path = el.dataset.i.split('.');
      let v = t; path.forEach(p=> v = v && v[p]);
      if (typeof v === 'string') el.textContent = v;
    });
    document.querySelector('[data-render="faq"]').innerHTML = t.faq.items.map((f,i)=>`
      <details ${i===0?'open':''}>
        <summary>
          <span class="q"><span class="qno">Q.0${i+1}</span><span>${f.q}</span></span>
          <span class="qmark">+</span>
        </summary>
        <p>${f.a}</p>
      </details>`).join('');
  }
  Okumiya.init({ page: 'faq', render });
})();
</script>
</body>
</html>
