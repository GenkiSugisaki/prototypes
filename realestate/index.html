<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>おくみや株式会社 — 鹿児島市の不動産・FP相談</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap"/>
<link rel="stylesheet" href="shared/base.css"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div data-nav-host></div>
<main>
  <section class="A-hero" id="top">
    <div class="container">
      <div class="A-hero-grid">
        <div>
          <span class="eyebrow" data-i="hero.eyebrow"></span>
          <h1 data-render="hero-title"></h1>
          <p class="lead" data-i="hero.lead"></p>
          <div class="ctas">
            <a class="btn btn-accent" href="contact.html"><span data-i="hero.cta_primary"></span></a>
            <a class="btn btn-ghost" href="about.html" data-i="hero.cta_secondary"></a>
          </div>
        </div>
        <div class="marg tate" data-i-lang="ja">鹿児島市・天文館より、住まいとお金の両面から、ご家族の選択を整える。</div>
      </div>
      <div class="A-meta">
        <div><b data-l="所在 / Location / 位置">所在</b><span data-i="hero.meta_location"></span></div>
        <div><b data-l="営業 / Hours / 营业">営業</b><span data-i="hero.meta_hours"></span></div>
        <div><b data-l="資格 / Cert / 资质">資格</b>FP · 宅建 · 住ロ</div>
      </div>
    </div>
    <div class="A-saku" data-saku></div>
  </section>

  <section class="A-fp">
    <div class="meta" data-hanko></div>
    <div>
      <span class="label" data-i="fp_strip.label"></span>
      <h3 data-i="fp_strip.title"></h3>
      <p data-i="fp_strip.sub"></p>
    </div>
    <div class="pills">
      <span>FP</span><span>宅建</span><span>住ロ</span><span style="opacity:.5">+</span>
    </div>
  </section>

  <section class="section" id="services">
    <div class="container">
      <div class="A-section-head">
        <div>
          <span class="eyebrow" data-i="services.eyebrow"></span>
          <h2 data-i="services.title"></h2>
        </div>
        <p class="tate" style="color:var(--ink-3);font-size:12px;padding-left:18px;border-left:1px solid var(--rule);max-height:140px;letter-spacing:.18em;display:none" data-i-lang="ja">家計の地図から、住まいを選ぶ。</p>
      </div>
      <div data-render="services"></div>
      <div style="margin-top:32px;display:flex;justify-content:flex-end">
        <a class="btn btn-ghost" href="services.html"><span data-l="サービスをすべてみる / All services / 查看全部服务"></span> →</a>
      </div>
    </div>
  </section>

  <section class="section" style="background:var(--paper)" id="properties">
    <div class="container">
      <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:36px">
        <div>
          <span class="eyebrow" data-i="properties.eyebrow"></span>
          <h2 style="font-size:var(--h2);margin-top:14px" data-i="properties.title"></h2>
          <p style="margin-top:8px;color:var(--ink-3);font-size:14px" data-i="properties.sub"></p>
        </div>
        <a class="mono" href="properties.html" style="font-size:12px;letter-spacing:.18em;text-transform:uppercase"><span data-i="properties.cta"></span> →</a>
      </div>
      <div class="grid cols-4" data-render="properties"></div>
    </div>
  </section>

  <section class="section" id="contact-cta" style="border-top:1px solid var(--rule);background:var(--paper)">
    <div class="container">
      <div class="A-cta-strip">
        <div class="A-cta-copy">
          <span class="eyebrow" data-i="contact.eyebrow"></span>
          <h2 class="A-cta-title"><span data-l="まずは、お気軽に。 / Just reach out. / 欢迎随时联系。"></span></h2>
          <div class="A-cta-meta">
            <span class="mono"><span data-l="営業時間 / Hours / 营业时间"></span></span>
            <span data-i="hero.meta_hours"></span>
          </div>
        </div>
        <div class="A-cta-channels">
          <a class="A-cta-card" href="tel:+81-99-xxx-xxxx">
            <span class="A-cta-label mono">TEL</span>
            <span class="A-cta-value mono" data-i="contact.tel"></span>
            <span class="A-cta-sub" data-l="平日 10:00 — 18:00 / Weekdays / 工作日"></span>
          </a>
          <a class="A-cta-card" href="mailto:hello@okumiya.jp">
            <span class="A-cta-label mono">MAIL</span>
            <span class="A-cta-value mono" data-i="contact.mail"></span>
            <span class="A-cta-sub" data-l="24時間受付 / Open inbox 24/7 · reply in 1–2 days / 24 小时咨询 · 1-2 个工作日回复"></span>
          </a>
          <a class="A-cta-card A-cta-card-accent" href="contact.html">
            <span class="A-cta-label mono"><span data-l="WEB / WEB / 网页"></span></span>
            <span class="A-cta-value" data-i="contact.cta"></span>
            <span class="A-cta-sub" data-l="フォームから / via form / 表单咨询"></span>
          </a>
        </div>
      </div>
    </div>
  </section>
</main>
<div data-foot-host></div>
<div data-tools-host></div>

<script src="shared/i18n.js"></script>
<script src="shared/property-images.js"></script>
<script src="shared/app.js"></script>
<script>
(function(){
  function render(){
    const lang = Okumiya.LS.get('lang','ja');
    const t = window.OKUMIYA_I18N[lang];
    document.querySelectorAll('[data-i]').forEach(el=>{
      const path = el.dataset.i.split('.');
      let v = t; path.forEach(p=> v = v && v[p]);
      if (typeof v === 'string') el.textContent = v;
    });
    document.querySelectorAll('[data-l]').forEach(el=>{
      const parts = el.dataset.l.split(' / ');
      el.textContent = parts[lang === 'ja' ? 0 : lang === 'en' ? 1 : 2] || parts[0];
    });
    document.querySelectorAll('[data-i-lang]').forEach(el=>{
      el.style.display = el.dataset.iLang === lang ? '' : 'none';
    });
    // hero title — 2-line treatment, accent on the second line
    const ht = document.querySelector('[data-render="hero-title"]');
    if (ht) ht.innerHTML = t.hero.title_v1.map((line,i)=>`<div${i===t.hero.title_v1.length-1?' class="accent"':''}>${line}</div>`).join('');
    // services
    const svc = document.querySelector('[data-render="services"]');
    if (svc) svc.innerHTML = t.services.items.map((s,i)=>`
      <div class="A-svc-row">
        <span class="num">0${i+1}</span>
        <div><h3>${s.name}</h3><p>${s.desc}</p></div>
        <span class="tag">${s.tag}</span>
      </div>`).join('');
    // properties — with real images
    const IMG = window.OKUMIYA_PROPERTY_IMAGES || [];
    const props = document.querySelector('[data-render="properties"]');
    if (props) props.innerHTML = t.properties.items.map((p,i)=>{
      const src = IMG[i];
      const imgHTML = src
        ? `<div class="A-prop-img" style="aspect-ratio:4/5;background-image:url('${src}');background-size:cover;background-position:center;position:relative">
             <span class="A-prop-tag">${p.tag}</span>
           </div>`
        : `<div class="ph-img" data-label="No.${String(i+1).padStart(2,'0')}" style="aspect-ratio:4/5"></div>`;
      return `
      <article class="A-prop">
        ${imgHTML}
        <div class="A-prop-meta"><span class="tag">${p.tag}</span><span class="mono" style="font-size:11px;color:var(--ink-3)">${p.area}</span></div>
        <h3>${p.name}</h3>
        <div class="price">${p.price}</div>
        <div class="meta-line">${p.meta}</div>
      </article>`;
    }).join('');
    // sakurajima
    const saku = document.querySelector('[data-saku]');
    if (saku) saku.innerHTML = Okumiya.sakurajimaSVG({ accent: true });
    // hanko
    const hk = document.querySelector('[data-hanko]');
    if (hk) hk.innerHTML = Okumiya.hankoSVG('FP', 72);
  }
  Okumiya.init({ page: 'home', render });
})();
</script>
</body>
</html>
