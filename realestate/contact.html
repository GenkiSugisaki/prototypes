<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>お問い合わせ — おくみや株式会社</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap"/>
<link rel="stylesheet" href="shared/base.css"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div data-nav-host></div>
<main>
  <section class="section">
    <div class="container A-contact-grid">
      <form onsubmit="event.preventDefault(); alert(this.dataset.thanks);" data-thanks="ありがとうございます。1〜2営業日以内にご連絡します。"
        style="background:var(--paper);padding:36px;border:1px solid var(--rule);border-radius:2px">
        <span class="eyebrow" data-i="contact.eyebrow"></span>
        <h2 style="font-size:clamp(28px,4vw,40px);margin-top:14px;margin-bottom:8px;line-height:1.2">
          <span data-l="相談フォーム / Contact form / 咨询表格"></span>
        </h2>
        <p style="margin-bottom:28px;color:var(--ink-3);font-size:14px" data-i="contact.sub"></p>
        <div class="field"><label data-l="お名前 / Name / 姓名"></label><input required/></div>
        <div class="field"><label>EMAIL</label><input type="email" required/></div>
        <div class="field"><label data-l="電話 (任意) / Phone (optional) / 电话(可选)"></label><input/></div>
        <div class="field"><label data-l="ご相談内容 / Topic / 咨询主题"></label>
          <select>
            <option data-l="売買仲介 / Buy & Sell / 房产买卖"></option>
            <option data-l="賃貸仲介 / Rental / 租赁"></option>
            <option data-l="FP相談 / Financial Planning / 财务规划"></option>
            <option data-l="移住相談 / Relocation / 移居咨询"></option>
            <option data-l="相続・空き家 / Inheritance / 继承"></option>
          </select>
        </div>
        <div class="field"><label data-l="メッセージ / Message / 留言"></label><textarea required></textarea></div>
        <button class="btn btn-accent" type="submit" style="width:100%;justify-content:center"><span data-l="送信する / Send / 发送"></span> →</button>
        <p class="mono" style="margin-top:12px;font-size:10px;color:var(--ink-3);letter-spacing:.1em" data-l="※ デモ用フォームです / Demo form / 演示用表单"></p>
      </form>
      <div>
        <span class="eyebrow"><span data-l="店舗情報 / Office info / 事务所信息"></span></span>
        <h3 style="font-size:clamp(22px,3vw,28px);margin-top:14px;line-height:1.3;margin-bottom:20px">
          <span data-l="鹿児島市・天文館 / Tenmonkan, Kagoshima / 鹿儿岛・天文馆"></span>
        </h3>
        <div>
          <div class="A-info-row"><b>TEL</b><span data-i="contact.tel"></span></div>
          <div class="A-info-row"><b>MAIL</b><span data-i="contact.mail"></span></div>
          <div class="A-info-row"><b>ADDR</b><span data-i="contact.addr"></span></div>
          <div class="A-info-row"><b>HOURS</b><span data-i="contact.hours"></span></div>
        </div>
        <div style="margin-top:28px;border:1px solid var(--rule);border-radius:2px;overflow:hidden;aspect-ratio:4/3">
          <iframe
            src="https://www.openstreetmap.org/export/embed.html?bbox=130.5476%2C31.5870%2C130.5666%2C31.5970&amp;layer=mapnik&amp;marker=31.5920%2C130.5571"
            style="width:100%;height:100%;border:0;display:block;filter:saturate(.8) contrast(1.05)"
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
            sandbox="allow-scripts allow-same-origin allow-popups"
            title="鹿児島市・天文館 — おくみや株式会社"></iframe>
        </div>
        <p class="mono" style="margin-top:8px;font-size:10px;color:var(--ink-3);letter-spacing:.1em">
          <a href="https://www.openstreetmap.org/?mlat=31.5920&amp;mlon=130.5571#map=17/31.5920/130.5571" target="_blank" rel="noopener">
            <span data-l="大きな地図でみる / View larger map / 查看大地图"></span> ↗
          </a>
        </p>
      </div>
    </div>
  </section>
</main>
<div data-foot-host></div>
<div data-tools-host></div>
<script src="shared/i18n.js"></script>
<script src="shared/app.js"></script>
<script>
(function(){
  function render(){
    const lang = Okumiya.LS.get('lang','ja');
    const t = window.OKUMIYA_I18N[lang];
    document.querySelectorAll('[data-i]').forEach(el=>{
      const path = el.dataset.i.split('.');
      let v = t; path.forEach(p=> v = v && v[p]);
      if (typeof v === 'string') el.textContent = v;
    });
    document.querySelectorAll('[data-l]').forEach(el=>{
      const parts = el.dataset.l.split(' / ');
      el.textContent = parts[lang==='ja'?0:lang==='en'?1:2] || parts[0];
    });
    const f = document.querySelector('form');
    f.dataset.thanks = lang==='ja' ? 'ありがとうございます。1〜2営業日以内にご連絡します。' : lang==='en' ? 'Thanks — we’ll get back within 1–2 business days.' : '谢谢，我们将在1-2个工作日内回复。';
  }
  Okumiya.init({ page: 'contact', render });
})();
</script>
</body>
</html>
